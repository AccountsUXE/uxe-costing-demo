<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UXE &amp; EMCODE · Project Costing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#f4f6f8;--surface:#fff;--surface-2:#eef2f6;--line:#d8dfe6;--fg:#172029;--muted:#5a6773;--faint:#8794a0;
  --accent:#1f3a86;--accent-weak:#e4e9f6;--accent-ink:#071952;--action:#ff8b00;--barbg:#071952;--baron:#fff;
  --good:#1f8a52;--good-bg:#e2f3e9;--warn:#b3781a;--warn-bg:#f8eed8;--crit:#c23b36;--crit-bg:#f8e2e1;
  --radius:10px;--shadow:0 1px 2px rgba(23,32,41,.06),0 2px 8px rgba(23,32,41,.05);
  --fdisplay:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --fbody:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--fmono:"SF Mono",ui-monospace,Consolas,monospace;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151b;--surface:#19222b;--surface-2:#202b35;--line:#2e3a45;--fg:#e6edf3;--muted:#9fb0bd;--faint:#6f8090;
  --accent:#8fb0ff;--accent-weak:#16223f;--accent-ink:#b9ccff;--good:#54c98a;--good-bg:#10311f;--warn:#e0a94a;--warn-bg:#352814;--crit:#eb7a74;--crit-bg:#3a1b19;--shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.3);color-scheme:dark;}}
/* EMCODE branding — black header + lime-green accent (follows the open project's entity) */
body.emcode-theme{--barbg:#0c130d;--baron:#fff;--action:#7cb342;--accent:#4e8a2d;--accent-ink:#356b1c;--accent-weak:#e8f3dc;--editbg:#eef6e2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body.emcode-theme{--accent:#9ccc65;--accent-ink:#bfe39a;--accent-weak:#16240f;--editbg:#26300f}}
body.emcode-theme .btn.primary,body.emcode-theme .ctmo-go,body.emcode-theme #gate .go{color:#0c130d}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--fbody);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-family:var(--fdisplay);font-weight:650}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}
/* gate */
#gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto;background:radial-gradient(1200px 600px at 15% -10%,#13245e 0,transparent 55%),radial-gradient(1000px 700px at 110% 120%,#0a3f1f 0,transparent 50%),linear-gradient(140deg,#0a1330,#0b1f52 55%,#0a1428)}
#gate .card{width:100%;max-width:440px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:34px 30px;backdrop-filter:blur(8px);box-shadow:0 30px 80px rgba(0,0,0,.5)}
#gate .logos{display:flex;align-items:center;gap:16px;margin-bottom:8px}#gate .logos img{height:28px}#gate .logos .div{width:1px;height:24px;background:rgba(255,255,255,.22)}
#gate h1{color:#fff;font-size:30px;line-height:1.1;margin-top:20px}#gate h1 .g{background:linear-gradient(90deg,#ff8b00,#ffd089);-webkit-background-clip:text;background-clip:text;color:transparent}
#gate p.sub{color:#b9c4dd;font-size:14px;margin:10px 0 22px}#gate label{display:block;color:#aeb9d4;font-size:12px;font-weight:600;margin:0 0 6px}
#gate input{width:100%;font:inherit;font-size:15px;padding:12px 14px;border-radius:11px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff}
#gate input:focus{outline:2px solid rgba(255,139,0,.5);border-color:#ff8b00}
#gate .go{margin-top:16px;width:100%;font:inherit;font-weight:700;font-size:15px;padding:13px;border:none;border-radius:11px;cursor:pointer;color:#1a1200;background:linear-gradient(90deg,#ff8b00,#ffa534)}
#gate .go:disabled{opacity:.6;cursor:default}
#gate .msg{font-size:13px;margin-top:12px;min-height:18px}#gate .msg.err{color:#ff9e9e}#gate .msg.ok{color:#9ff0c0}
#gate .foot{margin-top:22px;color:#8795b5;font-size:11.5px;border-top:1px solid rgba(255,255,255,.1);padding-top:14px}
/* bar */
.bar{position:sticky;top:0;z-index:20;background:var(--barbg);color:var(--baron);border-bottom:3px solid var(--action)}
.bar .wrap{display:flex;align-items:center;gap:10px;padding:9px 16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}.logo img{height:28px;display:block}
.bar .sp{flex:1}
.btn{font:inherit;font-size:13px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:var(--baron);padding:7px 11px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:rgba(255,255,255,.18)}.btn.primary{background:var(--action);border-color:var(--action);color:#1a1200;font-weight:650}
.who{font-family:var(--fmono);font-size:11px;color:#cfe;background:rgba(255,255,255,.12);padding:3px 9px;border-radius:999px}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 0}
.tabs button{font:inherit;font-weight:600;font-size:13.5px;border:none;background:transparent;color:var(--muted);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--accent-ink);border-bottom-color:var(--action)}
main{padding:18px 0 60px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card>header{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.card>header .n{width:24px;height:24px;border-radius:7px;background:var(--accent-weak);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.card>header h2{font-size:15px}.card .body{padding:14px 16px}
.grid{display:grid;gap:12px 16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
@media(max-width:760px){.g4,.g3,.g2{grid-template-columns:1fr 1fr}}@media(max-width:480px){.g4,.g3,.g2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}.field label{font-size:12px;color:var(--muted);font-weight:600}
.field input,.field select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--fg);min-width:0}
.field input:disabled{opacity:.7}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:4px 8px;border-bottom:1px solid var(--line)}
.tbl td input,.tbl td select{font:inherit;width:100%;padding:6px 8px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--fg)}
.tbl td input:focus{border-color:var(--accent);background:var(--surface-2);outline:none}
.tbl .num,.tbl td.num{text-align:right;font-family:var(--fmono)}
.rowscroll{overflow-x:auto}.addrow{margin-top:10px;color:var(--accent-ink);background:var(--accent-weak);border:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--accent-weak);color:var(--accent-ink)}
.stagebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.step{font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:600}
.step.done{background:var(--good-bg);color:var(--good)}.step.cur{background:var(--action);color:#1a1200}
.actionbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.actionbar .b{font:inherit;font-weight:650;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;background:var(--surface-2);color:var(--fg)}
.actionbar .b.ok{background:var(--good);border-color:var(--good);color:#fff}.actionbar .b.no{background:var(--crit-bg);border-color:var(--crit);color:var(--crit)}
.timeline{list-style:none;margin:0;padding:0;font-size:13px}
.timeline li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.timeline .w{width:150px;color:var(--muted);font-size:12px;flex:none}
.inbox-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;margin-bottom:8px}
.inbox-row:hover{border-color:var(--accent)}.inbox-row .t{font-weight:650}.inbox-row .s{margin-left:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#071952;color:#fff;padding:10px 18px;border-radius:10px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:13px}
/* custom-terms modal */
.ctmo{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(7,25,82,.45);backdrop-filter:blur(3px)}
.ctmo-card{width:100%;max-width:620px;max-height:88vh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.4);overflow:hidden}
.ctmo-hd{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.ctmo-t{font-family:var(--fdisplay);font-size:17px;font-weight:650;color:var(--accent-ink)}
.ctmo-s{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.ctmo-x{margin-left:auto;flex:none;font-size:22px;line-height:1;border:none;background:transparent;color:var(--faint);cursor:pointer;padding:0 2px}
.ctmo-list{padding:14px 20px 4px;overflow:auto}
.ctmo-empty{color:var(--muted);font-size:12.5px;font-style:italic;padding:8px 0 10px}
.ctmo-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.ctmo-n{flex:none;width:24px;height:24px;margin-top:4px;border-radius:7px;background:var(--accent-weak);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:12px}
.ctmo-row textarea{flex:1;font:inherit;font-size:13px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--fg);resize:vertical;min-height:40px}
.ctmo-row textarea:focus{outline:2px solid rgba(255,139,0,.4);border-color:var(--action)}
.ctmo-del{flex:none;margin-top:4px;width:26px;height:26px;border:1px solid var(--line);background:var(--surface);color:var(--crit);border-radius:8px;cursor:pointer;font-size:16px;line-height:1}
.ctmo-del:hover{background:var(--crit-bg)}
.ctmo-add{margin:4px 20px 2px;align-self:flex-start;font:inherit;font-size:13px;font-weight:600;border:1px dashed var(--accent);background:var(--accent-weak);color:var(--accent-ink);padding:8px 14px;border-radius:9px;cursor:pointer}
.ctmo-ft{display:flex;gap:10px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);margin-top:8px}
.ctmo-skip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:9px 14px;border-radius:9px;cursor:pointer}
.ctmo-go{margin-left:auto;font:inherit;font-size:13.5px;font-weight:700;border:none;background:var(--action);color:#1a1200;padding:10px 18px;border-radius:9px;cursor:pointer}
/* editable-field highlight (#2) */
input.ed,select.ed,textarea.ed{background:var(--editbg,#fff7ec)!important;border-color:var(--action)!important;box-shadow:inset 3px 0 0 var(--action)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) input.ed,:root:not([data-theme="light"]) select.ed,:root:not([data-theme="light"]) textarea.ed{--editbg:#2a2616}}
.edlegend{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);margin-left:auto}
.edlegend .sw{width:22px;height:14px;border-radius:4px;background:#fff7ec;border:1px solid var(--action);box-shadow:inset 3px 0 0 var(--action)}
/* info tooltip (#1) */
.inf{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;margin-left:5px;border-radius:50%;background:var(--accent-weak);color:var(--accent-ink);font-size:10px;font-weight:700;cursor:help;font-style:normal;vertical-align:middle;user-select:none}
th .inf{background:rgba(255,255,255,.18);color:#fff}
/* finance flag on a line (#6) */
tr.flagged td{background:var(--crit-bg)!important}
.flagchip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--crit);font-weight:600;background:var(--crit-bg);border:1px solid var(--crit);border-radius:6px;padding:2px 7px}
.rv{font-variant-numeric:tabular-nums;font-weight:600}
/* cost build-up (#7) */
.build{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 12px}
.build .st{flex:1;min-width:120px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface-2)}
.build .st.k{background:var(--accent-weak);border-color:var(--accent)}
.build .st .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.build .st .n{font-size:15px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums;margin-top:3px}
.build .op{align-self:center;color:var(--faint);font-weight:700;font-size:15px}
.cmtbox{margin-top:10px}.cmtbox textarea{width:100%;font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--fg);resize:vertical}
/* dashboard */
.dash{display:flex;flex-direction:column;gap:16px}
.dhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dhead h2{font-size:22px;font-weight:800;letter-spacing:-.01em}.dhead p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.livebadge{display:inline-flex;align-items:center;gap:7px;background:var(--accent-weak);color:var(--accent-ink);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600}
.livedot{width:8px;height:8px;border-radius:50%;background:#1f8a52;box-shadow:0 0 0 4px rgba(31,138,82,.2)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media(max-width:820px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.kpi .l{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:700}
.kpi .v{font-size:25px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:3px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.dcard .t{font-size:13.5px;font-weight:700}
.gaugewrap{position:relative;width:184px;height:184px;margin:12px auto 4px}
.gaugewrap .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gaugewrap .pct{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.gaugewrap .cap{font-size:12px;color:var(--muted);margin-top:2px}
.financeonly{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--accent-ink);background:var(--accent-weak);border-radius:999px;padding:3px 9px}
.buildbar{display:flex;height:30px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.buildbar>div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11.5px;font-weight:700}
.pcards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.pcards{grid-template-columns:1fr}}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.pbar{height:8px;background:var(--surface-2);border-radius:5px;overflow:hidden}.pbar>div{height:100%}
.locked{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:18px 20px;position:relative;overflow:hidden}
.locked .blur{filter:blur(3px);opacity:.5;pointer-events:none}
.locked .ov{position:absolute;left:0;right:0;bottom:0;padding:14px 20px;background:linear-gradient(transparent,var(--surface) 45%);font-size:12.5px;color:var(--muted)}
.sbadge{font-size:11px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap;display:inline-block}
.dtable{width:100%;border-collapse:collapse;min-width:760px}
.dtable th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);font-weight:700;padding:10px 14px;background:var(--surface-2)}
.dtable td{padding:11px 14px;border-top:1px solid var(--line);font-size:13px}
/* ===================== ELEGANT SHELL ===================== */
#app{display:flex;min-height:100vh}
#rail{width:248px;flex:none;background:var(--barbg);color:rgba(255,255,255,.72);display:flex;flex-direction:column;padding:20px 16px;position:sticky;top:0;height:100vh;overflow-y:auto}
#rail .rlogo{display:flex;align-items:center;gap:11px;padding:4px 8px 20px}
#rail .rlogo img{height:30px;display:block}
#rail .rlab{font-size:10.5px;letter-spacing:.2em;color:rgba(255,255,255,.4);margin-top:3px}
#rail .rsec{font-size:10.5px;letter-spacing:.14em;color:rgba(255,255,255,.38);font-weight:700;padding:6px 10px 8px}
#railnav{display:flex;flex-direction:column;gap:3px}
#railnav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;font:inherit;font-size:14px;font-weight:600;position:relative;background:transparent;border:none;color:rgba(255,255,255,.72);cursor:pointer;text-align:left;width:100%}
#railnav button:hover{background:rgba(255,255,255,.06)}
#railnav button.on{background:rgba(255,255,255,.09);color:#fff}
#railnav button.on:before{content:"";position:absolute;left:-16px;top:50%;transform:translateY(-50%);width:4px;height:22px;border-radius:0 4px 4px 0;background:var(--action)}
#railnav button .ic{width:20px;height:20px;display:grid;place-items:center;flex:none}
#railnav button .cnt{margin-left:auto;font-size:11px;font-weight:700;color:var(--action);background:rgba(255,139,0,.16);border-radius:999px;padding:2px 8px}
#rail .rent{display:flex;gap:6px;padding:0 6px 14px}
#rail .rent button{flex:1;font:inherit;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.7);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:8px 0;cursor:pointer}
#rail .rent button.on{color:#10131a;background:#fff;border-color:#fff;font-weight:700}
#rail .rdiv{height:1px;background:rgba(255,255,255,.08);margin:16px 10px}
#rail .ruser{margin-top:auto;display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:13px;padding:10px 12px}
#rail .ruser .av{width:36px;height:36px;border-radius:50%;background:var(--action);color:#160c00;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
#rail .ruser .nm{flex:1;min-width:0}.ruser .nm b{display:block;font-size:12.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ruser .nm span{font-size:11px;color:rgba(255,255,255,.5)}
#rail .ruser .lo{background:none;border:none;color:rgba(255,255,255,.5);cursor:pointer;display:grid;place-items:center;padding:4px}
#appmain{flex:999 1 720px;min-width:0;display:flex;flex-direction:column}
#apphead{display:flex;align-items:center;gap:16px;padding:14px 30px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:10}
#apphead h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
#apphead .asearch{flex:1;max-width:340px;display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:9px 13px}
#apphead .asearch input{border:none;background:none;outline:none;font:inherit;font-size:13.5px;color:var(--fg);width:100%}
#apphead .live{display:inline-flex;align-items:center;gap:7px;background:var(--good-bg);color:var(--good);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700}
#apphead .live .dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(31,138,82,.2)}
#apphead .hbtn{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 13px;cursor:pointer}
#apphead .hbtn.primary{color:#160c00;background:var(--action);border-color:var(--action);font-weight:700}
#view{padding:26px 30px 48px;display:block}
@media(max-width:820px){#rail{width:72px;padding:16px 10px}#rail .rlogo .rtxt,#railnav button span:not(.cnt),#rail .rsec,#rail .rent,#rail .ruser .nm,#rail .rdiv{display:none}#railnav button{justify-content:center}#railnav button.on:before{display:none}}
/* ===================== ELEGANT DASHBOARD ===================== */
.soft{box-shadow:0 1px 2px rgba(20,27,45,.04),0 10px 30px -20px rgba(20,27,45,.22)}
.dash{display:flex;flex-direction:column;gap:20px}
.dhero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.dhero .big{font-size:23px;font-weight:800;letter-spacing:-.015em}.dhero p{margin:3px 0 0;font-size:14px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
@media(max-width:1000px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.kpi .top{display:flex;align-items:center;justify-content:space-between}
.kpi .itile{width:38px;height:38px;border-radius:11px;display:grid;place-items:center}
.kpi .delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px}
.kpi .lab{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:16px}
.kpi .val{font-size:27px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
.dgrid2{display:grid;grid-template-columns:400px minmax(0,1fr);gap:18px}
@media(max-width:1000px){.dgrid2{grid-template-columns:1fr}}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 24px}
.dcard .t{font-size:14.5px;font-weight:700}
.gaugewrap{position:relative;margin:14px auto 6px}
.gaugewrap .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gaugewrap .pct{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.gaugewrap .cap{font-size:12.5px;color:var(--faint);font-weight:600;margin-top:2px}
.gstat{display:flex;gap:10px;margin-top:6px}.gstat>div{flex:1;background:var(--surface-2);border-radius:13px;padding:13px 15px}
.gstat .gl{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}.gstat .gv{font-size:17px;font-weight:800;margin-top:4px}
.finchip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent-weak);border-radius:999px;padding:4px 10px}
.buildbar{display:flex;height:40px;border-radius:12px;overflow:hidden;gap:3px}
.buildbar>div{display:flex;align-items:center;justify-content:center;color:#fff;border-radius:7px;font-size:13px;font-weight:800}
.bleg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}
.bleg .k{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-weight:600}
.bleg .v{font-size:18px;font-weight:800;margin-top:5px}
.bsum{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
.bsum .sl{font-size:11.5px;color:var(--faint);font-weight:600}.bsum .sv{font-size:18px;font-weight:800}
.dsplit{display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:18px}
@media(max-width:1000px){.dsplit{grid-template-columns:1fr}}
.ptbl{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.ptbl .ph{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.ptbl .ph .pt{font-size:15px;font-weight:800}
.prow{display:flex;align-items:center;gap:14px;padding:13px 12px;border-radius:12px;margin:0 10px}
.prow:hover{background:var(--surface-2)}
.av{border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.chip{font-size:11.5px;font-weight:700;border-radius:999px;padding:5px 11px;white-space:nowrap;display:inline-block}
.mpill{font-size:12.5px;font-weight:800;border-radius:8px;padding:4px 9px}
.pbar{height:8px;background:var(--surface-2);border-radius:5px;overflow:hidden}.pbar>div{height:100%;border-radius:5px}
.appr{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column}
.appr .ai{border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px}
.pcards{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:820px){.pcards{grid-template-columns:1fr}}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px}
.locked{background:var(--surface-2);border:1px dashed var(--line);border-radius:20px;padding:24px;position:relative;overflow:hidden}
.locked .blur{filter:blur(3px);opacity:.5;pointer-events:none}
.locked .ov{position:absolute;left:0;right:0;bottom:0;padding:16px 24px;background:linear-gradient(transparent,var(--surface-2) 42%);font-size:12.5px;color:var(--muted)}
@media print{.bar,.tabs,#rail,#apphead,.actionbar,.addrow,.btn,.noprint{display:none!important}body{background:#fff}#view{padding:0}}
</style>
</head>

/* ================= HELPERS ================= */
function $(s){return document.querySelector(s)}
function el(tag,attrs,kids){var e=document.createElement(tag);if(attrs)for(var k in attrs){if(k==="class")e.className=attrs[k];else if(k==="html")e.innerHTML=attrs[k];else if(k==="text")e.textContent=attrs[k];else e.setAttribute(k,attrs[k]);}(kids||[]).forEach(function(c){if(c)e.appendChild(c)});return e;}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.remove("hidden");clearTimeout(window.__tt);window.__tt=setTimeout(function(){t.classList.add("hidden")},2600);}
function money(n){return (Math.round(+n||0)).toLocaleString("en-US")}

async function api(path,opts){
  opts=opts||{};
  var h=opts.headers||{};
  h["Content-Type"]="application/json";
  if(S.token)h["Authorization"]="Bearer "+S.token;
  var r=await fetch(API_BASE+path,{method:opts.method||"GET",headers:h,body:opts.body?JSON.stringify(opts.body):undefined});
  var txt=await r.text();var data;try{data=JSON.parse(txt)}catch(e){data={error:txt.slice(0,200)}}
  if(!r.ok){
    if(r.status===401){signOut(true);}
    throw new Error(data.error||("Error "+r.status));
  }
  return data;
}

/* ================= AUTH ================= */
function gateMsg(m,kind){var e=$("#gateMsg");e.textContent=m||"";e.className="msg "+(kind||"");}
$("#btnSend").onclick=async function(){
  var email=($("#email").value||"").trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){gateMsg("Enter a valid email.","err");return;}
  this.disabled=true;gateMsg("Sending…");
  try{var out=await api("/auth/request-otp",{method:"POST",body:{email:email}});
    S._email=email;$("#step1").classList.add("hidden");$("#step2").classList.remove("hidden");gateMsg((out&&out.message)||"If the address is authorised, a code is on its way.","ok");$("#code").focus();
  }catch(e){gateMsg(e.message,"err");}
  this.disabled=false;
};
$("#btnVerify").onclick=async function(){
  var code=($("#code").value||"").trim();
  if(!/^\d{4,8}$/.test(code)){gateMsg("Enter the code from your email.","err");return;}
  this.disabled=true;gateMsg("Verifying…");
  try{var out=await api("/auth/verify-otp",{method:"POST",body:{email:S._email,code:code}});
    S.token=out.token;S.user=out.user;
    try{sessionStorage.setItem("cp_tok",S.token);sessionStorage.setItem("cp_user",JSON.stringify(S.user));}catch(e){}
    enterApp();
  }catch(e){gateMsg(e.message,"err");this.disabled=false;}
};
$("#backLink").onclick=function(e){e.preventDefault();$("#step2").classList.add("hidden");$("#step1").classList.remove("hidden");gateMsg("");};
$("#code").addEventListener("keydown",function(e){if(e.key==="Enter")$("#btnVerify").click()});
$("#email").addEventListener("keydown",function(e){if(e.key==="Enter")$("#btnSend").click()});
$("#btnLogout").onclick=function(){signOut(false)};
function signOut(expired){S.token=null;S.user=null;try{sessionStorage.removeItem("cp_tok");sessionStorage.removeItem("cp_user");}catch(e){}
  $("#app").classList.add("hidden");$("#gate").style.display="flex";$("#step2").classList.add("hidden");$("#step1").classList.remove("hidden");
  gateMsg(expired?"Your session expired — please sign in again.":"", expired?"err":"");}

function initials(s){s=s||"";var p=s.split(/[ @._-]+/).filter(Boolean);return ((p[0]||" ")[0]+((p[1]||"")[0]||"")).toUpperCase();}
function enterApp(){
  $("#gate").style.display="none";$("#app").classList.remove("hidden");
  $("#userName").textContent=(S.user.name||S.user.email);
  $("#userRole").textContent=(ROLE_LABEL[S.user.role]||S.user.role);
  $("#userAv").textContent=initials(S.user.name||S.user.email);
  $("#navNew").style.display=(S.user.role==="requester"||S.user.role==="admin")?"":"none";
  var eu=$("#entUXE"),em=$("#entEMC");
  if(eu)eu.onclick=function(){setBrand("UXE")};
  if(em)em.onclick=function(){setBrand("EMCODE")};
  buildTabs();
  S.project=null;S.tab="dashboard";setBrand(S.user.entity);renderTab();markTabs();
}

function visibleTabs(){
  var r=S.user.role, t=[];
  t.push(["dashboard","Dashboard"]);
  t.push(["costing","Costings"]);
  if(r==="hr"||r==="finance"||r==="admin")t.push(["hr","HR masters"]);
  if(r==="finance"||r==="admin")t.push(["finance","Finance"]);
  return t;
}
function buildTabs(){
  var box=$("#railnav");box.innerHTML="";
  visibleTabs().forEach(function(p){
    var b=el("button",{type:"button"});
    b.innerHTML="<span class='ic'>"+(RAIL_ICON[p[0]]||"")+"</span><span>"+p[1]+"</span>";
    b.onclick=function(){S.tab=p[0];renderTab();markTabs();};b._key=p[0];box.appendChild(b);
  });
  markTabs();
}
var TAB_TITLE={dashboard:"Dashboard",costing:"Costings",hr:"HR masters",finance:"Finance"};
function markTabs(){Array.prototype.forEach.call($("#railnav").children,function(b){b.classList.toggle("on",b._key===S.tab)});var pt=$("#pageTitle");if(pt)pt.textContent=TAB_TITLE[S.tab]||"Dashboard";}

/* ================= placeholder renderers (filled next) ================= */
function renderTab(){ var v=$("#view"); v.innerHTML="";
  if(S.tab==="dashboard"){ setBrand(S.user.entity); return renderDashboard(v); }
  if(!S.project){ v.appendChild(el("div",{class:"card"},[el("div",{class:"body",text:"Open an item from your inbox, or create a new costing."})])); return; }
  setBrand((S.project.project&&S.project.project.Entity)||S.user.entity); // brand follows the open project's entity
  if(S.tab==="costing")return renderCosting(v);
  if(S.tab==="hr")return renderHRMasters(v);
  if(S.tab==="finance")return renderFinance(v);
}
async function showInbox(){
  S.project=null;S.tab="inbox";markTabs();setBrand(S.user.entity);
  var v=$("#view");v.innerHTML="";
  v.appendChild(el("h2",{text:"Your inbox"}));
  try{var items=await api("/projects/inbox");
    if(!items.length){v.appendChild(el("div",{class:"card"},[el("div",{class:"body",text:"Nothing waiting on you right now."})]));return;}
    items.forEach(function(p){
      var row=el("div",{class:"inbox-row"},[
        el("span",{class:"t",text:(p.entity?p.entity+" · ":"")+(p.title||"(untitled)")}),
        el("span",{class:"pill s",text:STAGE_LABEL[p.stage]||p.stage})
      ]);
      row.onclick=function(){openProject(p.id)};
      v.appendChild(row);
    });
  }catch(e){toast(e.message);}
}
async function openProject(id){
  try{S._comment="";S.project=await api("/projects/"+id);S.project.id=id;S.tab="costing";markTabs();renderTab();}
  catch(e){toast(e.message);}
}
$("#navInbox").onclick=showInbox;
$("#navNew").onclick=async function(){
  try{var r=await api("/projects",{method:"POST",body:{}});toast("Draft created");openProject(r.id);}
  catch(e){toast(e.message);}
};

async function saveProject(fields){try{
    await api("/projects/"+S.project.id,{method:"PATCH",body:{fields:fields}});
    if(S.project&&S.project.project)Object.assign(S.project.project,fields); // keep local copy in sync (fixes stale entity in PDFs)

/* ================= field builders ================= */
function lbl(text,key){var l=el("label",{text:text});var inf=info(key);if(inf)l.appendChild(inf);return l;}
function pfield(label,key,editable,type){
  var w=el("div",{class:"field"});w.appendChild(lbl(label,key));
  var i=el("input",{});if(type==="date")i.type="date";if(type==="number")i.type="number";
  var v=P()[key];i.value=(v===0?0:(v||""));i.disabled=!editable;if(editable)i.className="ed";
  if(editable)i.onchange=function(){saveProject(defObj(key,type==="number"?(+i.value||0):i.value));};
  w.appendChild(i);return w;
}
function pselect(label,key,opts,editable){
  var w=el("div",{class:"field"});w.appendChild(lbl(label,key));
  var s=el("select",{});opts.forEach(function(o){var op=el("option",{text:o});op.value=o;s.appendChild(op);});
  s.value=P()[key]||opts[0];s.disabled=!editable;if(editable)s.className="ed";
  if(editable)s.onchange=function(){saveProject(defObj(key,s.value));};
  w.appendChild(s);return w;
}
function extensionField(editable){
  var w=el("div",{class:"field"});w.appendChild(lbl("Extension of","ParentRef"));
  var s=el("select",{});s.disabled=!editable;if(editable)s.className="ed";
  var cur=P().ParentRef?String(P().ParentRef):"";
  s.appendChild(el("option",{value:"",text:"— Standalone project —"}));
  if(cur)s.appendChild(el("option",{value:cur,text:"Linked project #"+cur}));
  s.value=cur;
  if(editable)s.onchange=function(){saveProject(defObj("ParentRef",s.value));};
  w.appendChild(s);
  api("/projects/options").then(function(opts){
    s.innerHTML="";s.appendChild(el("option",{value:"",text:"— Standalone project —"}));
    (opts||[]).filter(function(o){return String(o.id)!==String(S.project.id);}).forEach(function(o){s.appendChild(el("option",{value:String(o.id),text:(o.title||"(untitled)")+" · "+(STAGE_LABEL[o.stage]||o.stage)}));});
    s.value=cur;
  }).catch(function(){});
  return w;
}
function cellInput(val,editable,onsave,type,ph){
  var i=el("input",{});if(type==="number")i.type="number";
  i.value=(val===0?0:(val||""));i.disabled=!editable;if(editable)i.className="ed";
  if(ph!==undefined&&ph!==null&&ph!=="")i.placeholder=ph;
  if(editable)i.onchange=function(){onsave(type==="number"?(i.value===""?"":(+i.value||0)):i.value)};
  return i;
}

/* ================= stage + action bars ================= */
function stageBar(){
  var cur=P().Stage, idx=STAGES.indexOf(cur);
  var bar=el("div",{class:"stagebar"});
  STAGES.forEach(function(s,i){
    var c="step"+(i<idx?" done":"")+(i===idx?" cur":"");
    bar.appendChild(el("span",{class:c,text:STAGE_LABEL[s]||s}));
  });
  if(cur==="Costing"){
    bar.appendChild(el("span",{class:"step"+(P().HRStatus==="Done"?" done":""),text:"HR "+(P().HRStatus||"Pending")}));
    bar.appendChild(el("span",{class:"step"+(P().ProcStatus==="Done"?" done":""),text:"Proc "+(P().ProcStatus||"Pending")}));
  }
  return bar;
}
async function doTransition(action,needsComment,params){
  var comment=(S._comment||"").trim();   // optional note typed in the comment box (#4)
  if(needsComment&&!comment){comment=window.prompt("Reason / comment (required):")||"";if(!comment.trim()){toast("A reason is required.");return;}}
  try{var r=await api("/projects/"+S.project.id+"/transition",{method:"POST",body:{action:action,comment:comment,params:params||{}}});
    S._comment="";toast("Moved to "+(STAGE_LABEL[r.toStage]||r.toStage));openProject(S.project.id);}
  catch(e){toast(e.message);}
}
function commentBox(){
  var st=P().Stage,r=S.user.role;
  var show=((st==="Review-IT"&&(r==="itmanager"||r==="admin"))||(st==="Review-Finance"&&(r==="finance"||r==="admin")));
  if(!show)return null;
  var wrap=el("div",{class:"card"},[el("header",{},[el("span",{class:"n",text:"✎"}),el("h2",{text:"Review comment"})])]);
  var body=el("div",{class:"body cmtbox"});
  body.appendChild(el("p",{class:"muted",html:"Optional note attached to your next action (approve / return). A note is <b>required</b> when you return the request."}));
  var ta=el("textarea",{rows:"2",placeholder:"Add a comment for the team…"});ta.className="ed";ta.value=S._comment||"";ta.oninput=function(){S._comment=ta.value;};
  body.appendChild(ta);wrap.appendChild(body);return wrap;
}
function actionBar(){
  var st=P().Stage,r=S.user.role,admin=r==="admin",bar=el("div",{class:"actionbar"}),list=[];
  var add=function(label,cls,fn){list.push({label:label,cls:cls,fn:fn});};
  if(st==="Draft"&&(r==="requester"||admin))add("Submit for review","ok",function(){doTransition("submit")});
  if(st==="Review-IT"&&(r==="itmanager"||admin)){add("Approve → Costing","ok",function(){doTransition("it_approve")});add("Return to requester","no",function(){doTransition("it_return",true)});}
  if(st==="Costing"&&(r==="hr"||admin)&&P().HRStatus!=="Done"){add("Submit HR costs","ok",function(){doTransition("hr_submit")});add("Return to requester","no",function(){doTransition("hr_return",true)});}
  if(st==="Costing"&&(r==="procurement"||admin)&&P().ProcStatus!=="Done"){add("Submit procurement","ok",function(){doTransition("proc_submit")});add("Return to requester","no",function(){doTransition("proc_return",true)});}
  if(st==="Review-Finance"&&(r==="finance"||admin)){add("Approve price","ok",function(){doTransition("finance_approve")});add("Return to HR","no",function(){doTransition("finance_return",true,{target:"hr"})});add("Return to Procurement","no",function(){doTransition("finance_return",true,{target:"proc"})});add("Return to both","no",function(){doTransition("finance_return",true,{target:"costing"})});add("Return to requester","no",function(){doTransition("finance_return",true,{target:"draft"})});}
  if(st==="CEO-Approval"&&(r==="ceo"||admin)){add("Approve (below-30% margin)","ok",function(){doTransition("ceo_approve")});add("Reject → Finance","no",function(){doTransition("ceo_reject",true)});}
  if(st==="PM-Acceptance"&&(r==="pm"||admin)){add("Accept","ok",function(){doTransition("pm_accept")});add("Reject → Finance","no",function(){doTransition("pm_reject",true)});}
  if(st==="Approved"&&(r==="requester"||r==="finance"||admin))add("📄 Create proposal","ok",createProposal);
  bar.appendChild(el("span",{class:"pill",text:STAGE_LABEL[st]||st}));
  if(!list.length)bar.appendChild(el("span",{class:"muted",text:"No action for your role at this stage."}));
  list.forEach(function(a){var b=el("button",{class:"b "+a.cls,text:a.label});b.onclick=a.fn;bar.appendChild(b);});
  return bar;
}

function resourceTable(E){

  var hasLoaded=rs.some(function(r){return r.loaded!==undefined});       // #5 loaded cost -> HR/finance

  if(showPricing){thr.appendChild(thc("Margin %","marginPct",1));thr.appendChild(thc("Indirect %","indPct",1));thr.appendChild(thc("Overhead %","ohPct",1));thr.appendChild(thc("Flag","flagNote"));}

function buildupNode(t){
  if(t.direct===undefined||t.cost===undefined||t.price===undefined||t.indirect===undefined)return null;
  function st(label,val,key){var d=el("div",{class:"st"+(key?" k":"")});d.appendChild(el("div",{class:"l",text:label}));d.appendChild(el("div",{class:"n",text:"AED "+money(val)}));return d;}
  function op(s){return el("div",{class:"op",text:s});}
  var w=el("div",{class:"build"});
  w.appendChild(st("Direct cost",t.direct));w.appendChild(op("+"));
  w.appendChild(st("Indirect",t.indirect));w.appendChild(op("="));
  w.appendChild(st("Base cost",t.base!==undefined?t.base:(t.direct+t.indirect)));w.appendChild(op("+"));
  w.appendChild(st("Overhead",t.overhead));w.appendChild(op("="));
  w.appendChild(st("Total cost",t.cost));w.appendChild(op("+"));
  w.appendChild(st("Margin "+Math.round(t.marginPct||0)+"%",t.price-t.cost));w.appendChild(op("="));
  w.appendChild(st("Selling price",t.price,true));
  return w;
}
function summaryNode(){
  var t=S.project.totals;
  var out=el("div",{});
  var bu=buildupNode(t);
  if(bu){out.appendChild(el("p",{class:"muted",html:"Cost build-up — each step adds to the one before (#7):"}));out.appendChild(bu);}
  var rows=[];
  function row(k,v,pc){rows.push(el("tr",{},[el("td",{text:k}),el("td",{class:"num",text:pc?(Math.round(v)+"%"):("AED "+money(v))})]));}
  if(t.personnel!==undefined)row("Personnel (loaded)",t.personnel);
  if(t.materials!==undefined)row("Materials",t.materials);
  if(t.other!==undefined)row("Other direct",t.other);
  if(t.cost!==undefined)row("Total cost",t.cost);

function mcell(row,kind,col,canEdit){
  var val=row[col.key];
  if(col.type==="bool"){
    var s=el("select",{});["No","Yes"].forEach(function(o){s.appendChild(el("option",{text:o}))});s.value=val?"Yes":"No";s.disabled=!canEdit;
    if(canEdit)s.onchange=function(){msave(kind,row.id,col.key,s.value==="Yes")};return el("td",{},[s]);
  }
  if(col.type==="select"){
    var sel=el("select",{});col.opts.forEach(function(o){sel.appendChild(el("option",{text:o}))});sel.value=val||col.opts[0];sel.disabled=!canEdit;
    if(canEdit)sel.onchange=function(){msave(kind,row.id,col.key,sel.value)};return el("td",{},[sel]);
  }
  var td=el("td",{class:col.type==="number"?"num":""});
  td.appendChild(cellInput(val,canEdit,function(v){msave(kind,row.id,col.key,v)},col.type));return td;
}
function masterTable(kind,rows,cols,canEdit){
  var tbl=el("table",{class:"tbl"});var hr=el("tr",{});
  cols.forEach(function(c){hr.appendChild(el("th",{class:c.type==="number"?"num":"",text:c.label}))});
  if(canEdit)hr.appendChild(el("th",{text:""}));
  tbl.appendChild(el("thead",{},[hr]));
  var tb=el("tbody",{});
  rows.forEach(function(r){
    var tr=el("tr",{});
    cols.forEach(function(c){tr.appendChild(mcell(r,kind,c,canEdit))});
    if(canEdit){var td=el("td",{});var b=el("button",{class:"btn",text:"×"});b.onclick=function(){mdel(kind,r.id)};td.appendChild(b);tr.appendChild(td);}
    tb.appendChild(tr);
  });

  var out=el("div",{},[el("div",{class:"rowscroll"},[tbl])]);

}

var DEFAULT_SPECIAL=[
 "Advance payment of 30% is due with the Purchase Order and is non-refundable once project mobilisation has commenced.",
 "Any additional scope or change request will be quoted and approved in writing before work begins."
];
// Modal: add/edit/remove multiple custom (special) terms for this proposal.
function promptSpecialTerms(preset){
  return new Promise(function(resolve){
    var terms=(preset&&preset.length?preset.slice():DEFAULT_SPECIAL.slice());
    var ov=el("div",{class:"ctmo"});
    ov.innerHTML=
      "<div class='ctmo-card'>"+
        "<div class='ctmo-hd'><div><div class='ctmo-t'>Special / custom terms</div><div class='ctmo-s'>These appear under “Special / custom terms for this proposal” on the Terms &amp; Conditions page. Add, edit or remove as needed.</div></div><button class='ctmo-x' type='button' aria-label='Close'>&times;</button></div>"+
        "<div class='ctmo-list'></div>"+
        "<button class='ctmo-add' type='button'>+ Add term</button>"+
        "<div class='ctmo-ft'><button class='ctmo-skip' type='button'>Skip (standard terms only)</button><button class='ctmo-go' type='button'>Generate proposal →</button></div>"+
      "</div>";
    var list=ov.querySelector(".ctmo-list");
    function render(){
      list.innerHTML="";
      if(!terms.length){list.innerHTML="<div class='ctmo-empty'>No custom terms — only the 9 standard terms will be shown.</div>";}
      terms.forEach(function(tx,i){
        var row=el("div",{class:"ctmo-row"});
        row.innerHTML="<div class='ctmo-n'>"+(i+1)+"</div><textarea rows='2' placeholder='Type a custom term…'></textarea><button class='ctmo-del' type='button' aria-label='Remove'>&times;</button>";
        var ta=row.querySelector("textarea");ta.value=tx;
        ta.oninput=function(){terms[i]=ta.value;};
        row.querySelector(".ctmo-del").onclick=function(){terms.splice(i,1);render();};
        list.appendChild(row);
      });
    }
    render();
    function close(val){document.removeEventListener("keydown",onKey);ov.remove();resolve(val);}
    function onKey(e){if(e.key==="Escape")close(null);}
    ov.querySelector(".ctmo-add").onclick=function(){terms.push("");render();var tas=list.querySelectorAll("textarea");if(tas.length)tas[tas.length-1].focus();};
    ov.querySelector(".ctmo-x").onclick=function(){close(null);};
    ov.querySelector(".ctmo-skip").onclick=function(){close([]);};
    ov.querySelector(".ctmo-go").onclick=function(){close(terms.map(function(s){return s.trim();}).filter(Boolean));};
    ov.onclick=function(e){if(e.target===ov)close(null);};
    document.addEventListener("keydown",onKey);
    document.body.appendChild(ov);
    var first=list.querySelector("textarea");if(first)first.focus();
  });
}

}
